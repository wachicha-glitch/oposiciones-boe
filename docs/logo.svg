<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Oposiciones BOE Hoy">
  <!-- Fondo: tinta de imprenta, el color base del sitio -->
  <rect width="64" height="64" rx="12" fill="#1B2440"/>
  <!-- Anillo exterior del sello -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#97672B" stroke-width="3"/>
  <!-- Anillo interior punteado, como el troquelado de un sello oficial -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#97672B" stroke-width="1.2" stroke-dasharray="2.5 2.5" opacity="0.75"/>
  <!-- Símbolo de sección (§): la marca de los textos legales y del BOE -->
  <text x="32" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold"
        fill="#C8912F" text-anchor="middle" dominant-baseline="central">§</text>
</svg>
